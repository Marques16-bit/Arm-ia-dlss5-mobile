name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "arm-ia.zip"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android SDK Components
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/android-sdk
            ~/.android/avd
          key: ${{ runner.os }}-android-sdk-34-ndk-26.3.11579264

      - name: Install Android SDK, NDK & CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Setup Gradle Environment & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Compile Debug APK
        run: ./gradlew :app:assembleDebug --parallel --build-cache --stacktrace

      - name: Prepare Artifact Binary
        run: |
          mkdir -p output/
          cp app/build/outputs/apk/debug/app-debug.apk output/ArmIA-v${{ github.run_number }}-debug.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmIA-v${{ github.run_number }}-debug
          path: output/ArmIA-v${{ github.run_number }}-debug.apk
          retention-days: 14
