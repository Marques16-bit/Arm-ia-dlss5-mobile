name: Compilar APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "arm-ia.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar SDK, NDK e CMake do Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar (debug)
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear o APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArmIA-debug.apk

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ArmIA-debug
          path: ArmIA-debug.apk

      - name: Publicar na aba Releases (baixa direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Arm-IA build ${{ github.run_number }}
          prerelease: true
          files: ArmIA-debug.apk
