name: Descompactar projeto
on:
  push:
    paths:
      - "arm-ia*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: descompactar-projeto
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o zip
        run: |
          shopt -s nullglob
          zips=(arm-ia*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Nenhum arm-ia*.zip na raiz: provavelmente já foi descompactado. Nada a fazer."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Abrindo $z"
            unzip -o "$z" -d .
            rm -- "$z"
          done

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Importa o projeto Arm-IA" || echo "Nada novo para salvar"
          git push
